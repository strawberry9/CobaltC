# Builds CobaltC on machines that have never seen the project, with a C
# compiler alone (D-0326): a fresh clone, `boot`, then the conformance suite
# with the compiler it made. A GitHub runner is a new PC every time. The
# Windows job stands for the owner's checkpoints W1-W3 (D-0326, owner
# 2026-11-15): MinGW-w64's GCC, no Rust on PATH.
name: bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: windows-latest
            cc: gcc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: No Rust on PATH (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for t in rustc cargo rustup; do
            if command -v $t >/dev/null 2>&1; then
              d=$(dirname "$(command -v $t)")
              echo "removing $d from PATH ($t)"
              echo "PATH=$(echo "$PATH" | tr ':' '\n' | grep -vxF "$d" | paste -sd:)" >> "$GITHUB_ENV"
            fi
          done
      - name: No Rust on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $keep = $env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'rustc.exe')) -and -not (Test-Path (Join-Path $_ 'cargo.exe')) }
          "PATH=$($keep -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: The C compiler
        shell: bash
        run: ${{ matrix.cc }} --version
      - name: boot (Linux)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
        run: |
          ! command -v rustc
          $CC impl/bootstrap/boot.c -o boot
          ./boot
      - name: boot (Windows, command prompt)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          where rustc && exit /b 1
          gcc impl\bootstrap\boot.c -o boot.exe || exit /b 1
          boot.exe || exit /b 1
      - name: Conformance suite with the compiler boot made
        shell: bash
        run: |
          root=$PWD
          if command -v cygpath > /dev/null 2>&1; then root=$(cygpath -m "$PWD"); fi
          python3 impl/conformance/run.py --jobs 4 --impl "$root/impl/target/release/cobc --cc ${{ matrix.cc }} --run {file}"
      # CHG-0460: a contained fault's jump back to a thread's first frame. On
      # Windows `longjmp` unwound the stack to get there, and read past the
      # end of the thread's stack in about a third of the runs of this case.
      - name: A contained fault near the top of a thread's stack, 60 times (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set +e
          root=$(cygpath -m "$PWD")
          mkdir -p contained
          cp impl/conformance/14-control-flow/discarded_noted_results_end_with_statement_ok.cb contained/d.cb
          cd contained
          "$root/impl/target/release/cobc" --cc ${{ matrix.cc }} -o d.exe d.cb || exit 1
          ./d.exe > want.txt || exit 1
          bad=0
          for i in $(seq 1 60); do
            ./d.exe > got.txt 2> err.txt; rc=$?
            if [ $rc -ne 0 ] || ! cmp -s want.txt got.txt; then bad=$((bad+1)); echo "run $i: exit status $rc"; fi
          done
          echo "$bad of 60 runs failed"
          [ $bad -eq 0 ]
      # CHG-0476 (032, 037): what cobc does on a real Windows console and job
      # object, which Wine cannot show: the processor limit, a console break,
      # and cobc killed outright.
      - name: cobc's cleanup and limits on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          root=$(cygpath -m "$PWD")
          python3 impl/tests/windows/cleanup.py "$root/impl/target/release/cobc" ${{ matrix.cc }}
