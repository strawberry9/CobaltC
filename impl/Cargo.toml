[package]
name = "coby"
version = "0.1.0"
edition = "2021"

[dependencies]

[[bin]]
name = "coby"
path = "src/main.rs"

[lib]
name = "coby"
path = "src/lib.rs"

[workspace]
members = ["cobc", "cbrt", "cobfmt"]

# The runtime linked into every compiled program: one codegen unit, so its
# hot paths sit together (with sixteen they were spread across the text,
# and instruction-cache misses tripled on element-heavy programs, D-0202).
[profile.release.package.cbrt]
codegen-units = 1
