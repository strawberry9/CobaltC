[package]
name = "cobc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cobc"
path = "src/main.rs"

[dependencies]
coby = { path = ".." }

# Built with `cobc` on Linux, so `libcbrt.a` is beside it; not linked into
# `cobc` on Windows, where the crate would pull the runtime's C-facing code
# into `cobc.exe` (D-0255). Build it there with `-p cbrt -p cobc`.
[target.'cfg(not(windows))'.dependencies]
cbrt = { path = "../cbrt" }
