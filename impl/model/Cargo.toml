[package]
name = "cobmodel"
version = "0.1.0"
edition = "2021"
description = "An independent executable model of CobaltC's alias and thread rules (D-0219)"

# No dependencies, and in particular none on `coby`, `cobc` or `cbrt`: the
# model is written from the specification, not from the tools it checks.
[dependencies]

[[bin]]
name = "cobmodel"
path = "src/main.rs"

